<!DOCTYPE html>
<!--
  매출 대시보드 — 『클로드 활용 입문서』 4장 예제 4.6~4.7 재현
  - 상단 요약 카드: 총매출 / 월평균 / 전월 대비 증감률
  - 월별 매출 합계 막대 그래프 (막대에 마우스를 올리면 제품별 세부 수치 툴팁)
  - 6개월 누적 제품별 비중 파이 차트
  - 파란색 계열로 통일
  외부 라이브러리 없이 canvas로 그려, 인터넷 연결 없이 브라우저로 바로 열립니다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f0f6ff; padding: 28px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #0f172a;
  }
  .dash { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 6px 18px rgba(30,64,175,.08); }
  .card .label { font-size: 13px; color: #64748b; }
  .card .value { font-size: 24px; font-weight: 700; color: #1d4ed8; margin-top: 6px; }
  .card .value.down { color: #dc2626; }
  .panel { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 18px; box-shadow: 0 6px 18px rgba(30,64,175,.08); }
  .panel h2 { font-size: 15px; margin: 0 0 14px; color: #334155; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: auto; }
  .legend { font-size: 13px; color: #475569; margin-top: 10px; line-height: 1.8; }
  .legend span { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  #tip {
    position: fixed; pointer-events: none; background: #0f172a; color: #fff; font-size: 12px;
    padding: 8px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; line-height: 1.6; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="dash">
    <h1>매출 대시보드</h1>
    <div class="cards">
      <div class="card"><div class="label">총매출</div><div class="value" id="total"></div></div>
      <div class="card"><div class="label">월평균</div><div class="value" id="avg"></div></div>
      <div class="card"><div class="label">전월 대비</div><div class="value" id="growth"></div></div>
    </div>
    <div class="row">
      <div class="panel">
        <h2>월별 매출 합계</h2>
        <canvas id="bar" width="440" height="260"></canvas>
      </div>
      <div class="panel">
        <h2>제품별 비중 (6개월 누적)</h2>
        <canvas id="pie" width="260" height="260"></canvas>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>
  <div id="tip"></div>

<script>
  const data = [
    { m: '1월', A: 1200, B: 850,  C: 430 },
    { m: '2월', A: 1350, B: 900,  C: 510 },
    { m: '3월', A: 1100, B: 780,  C: 480 },
    { m: '4월', A: 1480, B: 1020, C: 620 },
    { m: '5월', A: 1600, B: 1150, C: 700 },
    { m: '6월', A: 1750, B: 1200, C: 780 },
  ];
  const products = ['A', 'B', 'C'];
  const colors = { A: '#1d4ed8', B: '#3b82f6', C: '#93c5fd' }; // 파란색 계열
  const won = (n) => '₩' + n.toLocaleString('ko-KR');

  const totals = data.map(d => d.A + d.B + d.C);
  const grandTotal = totals.reduce((a, b) => a + b, 0);
  const avg = Math.round(grandTotal / data.length);
  const growth = ((totals[5] - totals[4]) / totals[4] * 100);

  document.getElementById('total').textContent = won(grandTotal);
  document.getElementById('avg').textContent = won(avg);
  const g = document.getElementById('growth');
  g.textContent = (growth >= 0 ? '+' : '') + growth.toFixed(1) + '%';
  if (growth < 0) g.classList.add('down');

  // ---- 막대 그래프 + 툴팁 ----
  const bar = document.getElementById('bar'), bx = bar.getContext('2d');
  const padL = 48, padB = 28, padT = 12, W = bar.width, H = bar.height;
  const maxV = Math.ceil(Math.max(...totals) / 1000) * 1000;
  const plotW = W - padL - 12, plotH = H - padB - padT;
  const bw = plotW / data.length * 0.55;
  const barRects = [];

  function drawBars() {
    bx.clearRect(0, 0, W, H);
    bx.strokeStyle = '#e2e8f0'; bx.fillStyle = '#94a3b8'; bx.font = '11px sans-serif';
    for (let i = 0; i <= 4; i++) {
      const v = maxV / 4 * i, y = padT + plotH - (v / maxV) * plotH;
      bx.beginPath(); bx.moveTo(padL, y); bx.lineTo(W - 12, y); bx.stroke();
      bx.fillText((v / 1000) + 'k', 8, y + 3);
    }
    barRects.length = 0;
    data.forEach((d, i) => {
      const cx = padL + plotW / data.length * (i + 0.5);
      const h = (totals[i] / maxV) * plotH;
      const x = cx - bw / 2, y = padT + plotH - h;
      bx.fillStyle = '#2563eb';
      bx.fillRect(x, y, bw, h);
      bx.fillStyle = '#475569'; bx.textAlign = 'center';
      bx.fillText(d.m, cx, H - 10);
      bx.textAlign = 'left';
      barRects.push({ x, y, w: bw, h, d });
    });
  }
  drawBars();

  const tip = document.getElementById('tip');
  bar.addEventListener('mousemove', (e) => {
    const r = bar.getBoundingClientRect();
    const sx = (e.clientX - r.left) * (W / r.width);
    const sy = (e.clientY - r.top) * (H / r.height);
    const hit = barRects.find(b => sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h);
    if (hit) {
      tip.style.opacity = 1;
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
      tip.innerHTML = `<b>${hit.d.m}</b><br>제품A ${won(hit.d.A)}<br>제품B ${won(hit.d.B)}<br>제품C ${won(hit.d.C)}`;
    } else { tip.style.opacity = 0; }
  });
  bar.addEventListener('mouseleave', () => tip.style.opacity = 0);

  // ---- 파이 차트 ----
  const pie = document.getElementById('pie'), px = pie.getContext('2d');
  const sums = products.map(p => data.reduce((a, d) => a + d[p], 0));
  const pieTotal = sums.reduce((a, b) => a + b, 0);
  let start = -Math.PI / 2;
  const cx2 = pie.width / 2, cy2 = pie.height / 2, rad = 95;
  products.forEach((p, i) => {
    const ang = sums[i] / pieTotal * Math.PI * 2;
    px.beginPath(); px.moveTo(cx2, cy2);
    px.arc(cx2, cy2, rad, start, start + ang);
    px.closePath(); px.fillStyle = colors[p]; px.fill();
    start += ang;
  });
  document.getElementById('legend').innerHTML = products.map((p, i) =>
    `<div><span style="background:${colors[p]}"></span>제품${p} — ${won(sums[i])} (${(sums[i]/pieTotal*100).toFixed(1)}%)</div>`
  ).join('');
</script>
</body>
</html>
