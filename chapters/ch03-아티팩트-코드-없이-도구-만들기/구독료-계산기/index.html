<!DOCTYPE html>
<!--
  구독료 계산기 — 『클로드 활용 입문서』 3장 예제 3.2~3.3 재현
  - 서비스 추가/삭제, 월·연 합계
  - 항목별 월간/연간 결제 토글, 연간은 12로 나눠 월 환산
  - 월 환산 기준 최고가 항목 강조(👑)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구독료 계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #0f172a; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(15,23,42,.08);
    width: 100%; max-width: 420px; padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  .totals {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
  }
  .total-box {
    background: #f8fafc; border-radius: 14px; padding: 14px; text-align: center;
  }
  .total-box span { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
  .total-box strong { font-size: 20px; color: #0f172a; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .add-row input { flex: 1; min-width: 100px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
  .add-row input[type="number"] { max-width: 110px; }
  .toggle { display: flex; border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; }
  .toggle button {
    border: none; background: #fff; padding: 10px 12px; font-size: 13px; cursor: pointer; color: #64748b;
  }
  .toggle button.active { background: #0f172a; color: #fff; }
  .btn-add {
    width: 100%; padding: 12px; border: none; border-radius: 12px; background: #0f172a; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px;
  }
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; background: #f8fafc;
    border: 1px solid #e2e8f0;
  }
  .item.top { background: #fef9c3; border-color: #fde047; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 14px; }
  .item-price { font-size: 13px; color: #475569; margin-top: 2px; }
  .item-sub { font-size: 11px; color: #94a3b8; }
  .del {
    border: none; background: transparent; cursor: pointer; font-size: 18px; opacity: .5; padding: 4px;
  }
  .del:hover { opacity: 1; }
  .empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 24px 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>구독료 계산기</h1>
    <div class="sub">매달 빠져나가는 구독료를 한눈에 확인하세요.</div>

    <div class="totals">
      <div class="total-box"><span>월 합계</span><strong id="monthlyTotal">₩0</strong></div>
      <div class="total-box"><span>연간 합계</span><strong id="yearlyTotal">₩0</strong></div>
    </div>

    <div class="add-row">
      <input id="nameInput" type="text" placeholder="서비스 이름">
      <input id="priceInput" type="number" placeholder="금액" min="0">
      <div class="toggle" id="cycleToggle">
        <button type="button" class="active" data-cycle="monthly">월간</button>
        <button type="button" data-cycle="yearly">연간</button>
      </div>
    </div>
    <button class="btn-add" id="addBtn">추가</button>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">구독 서비스를 추가해 보세요.</div>
  </div>

<script>
  let items = [];
  let addCycle = 'monthly';

  const fmt = (n) => '₩' + Math.round(n).toLocaleString('ko-KR');

  function monthlyEquiv(item) {
    return item.cycle === 'yearly' ? item.price / 12 : item.price;
  }

  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';
    if (!items.length) {
      empty.style.display = 'block';
      document.getElementById('monthlyTotal').textContent = '₩0';
      document.getElementById('yearlyTotal').textContent = '₩0';
      return;
    }
    empty.style.display = 'none';

    const equivs = items.map(monthlyEquiv);
    const max = Math.max(...equivs);

    items.forEach((item, i) => {
      const eq = equivs[i];
      const li = document.createElement('li');
      li.className = 'item' + (eq === max && items.length > 1 ? ' top' : '');
      const crown = eq === max && items.length > 1 ? '👑 ' : '';
      const sub = item.cycle === 'yearly'
        ? `<div class="item-sub">연 ₩${item.price.toLocaleString('ko-KR')} 결제</div>`
        : '';
      li.innerHTML = `
        <div class="item-info">
          <div class="item-name">${crown}${item.name}</div>
          <div class="item-price">${fmt(eq)}/월</div>
          ${sub}
        </div>
        <button class="del" data-i="${i}" title="삭제">🗑</button>`;
      list.appendChild(li);
    });

    const monthly = equivs.reduce((a, b) => a + b, 0);
    document.getElementById('monthlyTotal').textContent = fmt(monthly);
    document.getElementById('yearlyTotal').textContent = fmt(monthly * 12);

    list.querySelectorAll('.del').forEach((btn) => {
      btn.addEventListener('click', () => {
        items.splice(Number(btn.dataset.i), 1);
        render();
      });
    });
  }

  function addItem() {
    const name = document.getElementById('nameInput').value.trim();
    const price = Number(document.getElementById('priceInput').value);
    if (!name || !price) return;
    items.push({ name, price, cycle: addCycle });
    document.getElementById('nameInput').value = '';
    document.getElementById('priceInput').value = '';
    document.getElementById('nameInput').focus();
    render();
  }

  document.getElementById('addBtn').addEventListener('click', addItem);
  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });
  document.getElementById('priceInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });

  document.getElementById('cycleToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-cycle]');
    if (!btn) return;
    addCycle = btn.dataset.cycle;
    document.querySelectorAll('#cycleToggle button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
  });

  render();
</script>
</body>
</html>
