<!DOCTYPE html>
<!--
  개인 포트폴리오 페이지 — 『클로드 활용 입문서』 8장 예제 8.3 재현
  바이브 코딩으로 만든 결과물을 같은 구성으로 담았습니다.
  - 상단: 이름·직함·소개 배너
  - 본문: 주요 작업물 카드 3장 (제목 + 링크 자리)
  - 화이트/연한 파랑 베이스에 짙은 네이비 강조색 (수정 후 배경 #EFF6FF)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박지수 · 포트폴리오</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>박지수</h1>
    <p class="title">프리랜서 콘텐츠 디자이너</p>
    <p class="intro">“브랜드의 이야기를 시각으로 만드는 사람입니다”</p>
  </header>

  <main class="work">
    <h2>주요 작업물</h2>
    <div class="cards">
      <article class="card">
        <h3>브랜드 로고 리디자인</h3>
        <p>브랜드 정체성을 담은 로고 리뉴얼 작업입니다.</p>
        <a class="link" href="#">자세히 보기</a>
      </article>
      <article class="card">
        <h3>뉴스레터 템플릿</h3>
        <p>일관된 톤으로 발송하는 뉴스레터 디자인 템플릿입니다.</p>
        <a class="link" href="#">자세히 보기</a>
      </article>
      <article class="card">
        <h3>인스타그램 피드 기획</h3>
        <p>브랜드 무드를 살린 인스타그램 피드 콘텐츠 기획입니다.</p>
        <a class="link" href="#">자세히 보기</a>
      </article>
    </div>
  </main>
</body>
</html>
